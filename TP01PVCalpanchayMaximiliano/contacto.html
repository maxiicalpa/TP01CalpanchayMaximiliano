<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Jujuy</title>
        <link rel="stylesheet" href="css/styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
<body>
    <header>
        <h1>Contacto</h1>
        <nav>
            <h2><a href="index.html">Inicio</a></h2>
            <h2><a href="museos.html">Museos</a></h2>
            <h2><a href="contacto.html">Contacto</a></h2>
        </nav>
    </header>
    <section>
        <h2>Contactactese con nosotros</h2>
        <form>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" required></textarea>
            <button type="submit" onclick="guardar()">Enviar</button>
        </form>
    </section>
    <footer>
        <p>© 2025 | Informacion cultural Jujuy | </p>
    </footer>
    <script>
        function guardar() {
            event.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const mensaje = document.getElementById('mensaje').value;

            console.log("Formulario completado:");
            console.log("Nombre:", nombre);
            console.log("Email:", email);
            console.log("Mensaje:", mensaje);
            alert("Su mensaje ha sido enviado. Nos comunicaremos con usted.");
        }
    </script>
</body>
</html>
